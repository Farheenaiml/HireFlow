# Render blueprint for HireFlow

services:
  - type: web
    name: hireflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: LLM_PROVIDER
        value: groq

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: SCREEN_DELAY
        value: "2"

      - key: LLM_MAX_RETRIES
        value: "3"

      - key: LLM_RETRY_BASE
        value: "1.5"

      - key: USE_N8N
        value: "true"

      - key: N8N_BASE_URL
        value: https://farheen22.app.n8n.cloud

      - key: N8N_API_KEY
        sync: false

      - key: INTERNAL_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: ""